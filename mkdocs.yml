site_name: NarraMaker
site_description: NarraMaker の使い方とリファレンス

theme:
  name: mkdocs
  language: ja
  navigation_depth: 2
  analytics:
    gtag: G-4RSQM49FHR # GA4 測定 ID（例: G-XXXXXXXXXX）を設定すると有効になります

extra_css:
  - stylesheets/material-style.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html

nav:
  - ▶️ ホーム: index.md
  - ▶️ ダウンロード: 
    - ▶️ 動作環境: environment.md
    - ▶️ 使ってみよう: get-started.md
    - ▶️ ダウンロード: download.md
  - ▶️ ガイド・FAQ: guide-top.md
  - ▶️ ヘルプ: help-top.md
  - ▶️ ご利用条件: 
    - ▶️ ライセンス: LICENSE.md
    - ▶️ 開発コミュニティー: COMMUNITY.md



